version: '3'

tasks:
    # --- Install ---
    install:
        aliases: [i]
        desc: Install dependencies
        cmd: npm install

    # --- Build ---
    build:
        aliases: [b]
        desc: Compile TypeScript (removes stale output in dist/ first)
        cmds:
            - rm -rf dist
            - npx tsc

    # --- Tests ---
    test:
        aliases: [t]
        desc: Run all tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/**/*.spec.js'

    test-rest:
        aliases: [ta]
        desc: Run REST tests only
        deps: [build]
        cmd: npx mocha --spec 'dist/test/rest/**/*.spec.js'

    test-soap:
        aliases: [tsoap]
        desc: Run SOAP tests only
        deps: [build]
        cmd: npx mocha --spec 'dist/test/soap/**/*.spec.js'

    test-regression:
        aliases: [tr]
        desc: Run REST regression tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/rest/regression/**/*.spec.js'

    test-soap-regression:
        aliases: [tsoapr]
        desc: Run SOAP regression tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/soap/regression/**/*.spec.js'

    test-smoke:
        aliases: [tsm]
        desc: Run REST smoke tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/rest/smoke/**/*.spec.js'

    test-soap-smoke:
        aliases: [tsoapsm]
        desc: Run SOAP smoke tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/soap/smoke/**/*.spec.js'

    test-mock:
        aliases: [tm]
        desc: Run REST mock tests (WireMock) — starts and stops the container automatically
        deps: [build]
        cmds:
            - task: wiremock-up
            - defer: { task: wiremock-down }
            - cmd: npx mocha --spec 'dist/test/rest/mock/**/*.spec.js'

    # --- WireMock ---
    wiremock-up:
        desc: Start the WireMock container and wait until it's ready
        cmds:
            - docker compose up -d wiremock
            - until curl -sf http://localhost:8080/__admin/mappings > /dev/null; do sleep 0.5; done

    wiremock-down:
        desc: Stop the WireMock container
        cmd: docker compose down

    # --- Code quality ---
    lint:
        aliases: [l]
        desc: Run ESLint
        cmd: npx eslint .

    lint-fix:
        aliases: [lf]
        desc: Run ESLint with auto-fix
        cmd: npx eslint . --fix

    format:
        aliases: [fmt]
        desc: Format code with Prettier
        cmd: npx prettier --write .

    format-check:
        aliases: [fc]
        desc: Check formatting with Prettier (CI)
        cmd: npx prettier --check .

    # --- Allure report ---
    report:
        aliases: [r]
        desc: Run tests and generate Allure report
        cmds:
            - task: build
            - cmd: npx mocha --spec 'dist/test/**/*.spec.js' --reporter allure-mocha --reporter-option resultsDir=allure-results
            - cmd: allure generate allure-results --clean -o allure-report
            - cmd: allure open allure-report
